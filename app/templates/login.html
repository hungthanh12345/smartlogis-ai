<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts: Be Vietnam Pro & Plus Jakarta Sans (Tối ưu hóa hiển thị tiếng Việt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', '"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, ::before, ::after {
      font-family: 'Be Vietnam Pro', 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: 'Be Vietnam Pro', 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-sky-500/10 text-sky-400 border border-sky-500/20 text-3xl mb-4">
        <i class="fa-solid fa-boxes-stacked"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-wide">SmartLogis AI</h1>
      <p class="text-xs text-sky-400 font-semibold mt-1">HỆ THỐNG QUẢN LÝ KHO TÍCH HỢP AI V2.0</p>
      <p class="text-xs text-slate-400 mt-2">Bảo vệ tính toàn vẹn CSDL bằng giao dịch ACID & AI Advisory</p>
    </div>

    <!-- Alert message -->
    <div id="error-box" class="hidden mb-5 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center gap-2">
      <i class="fa-solid fa-triangle-exclamation text-rose-400"></i>
      <span id="error-message"></span>
    </div>

    <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Tên Đăng Nhập</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 text-sm">
            <i class="fa-regular fa-user"></i>
          </span>
          <input type="text" id="username" required placeholder="Nhập tên đăng nhập"
            class="w-full pl-9 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Mật Khẩu</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500 text-sm">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full pl-9 pr-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition">
        </div>
      </div>

      <button type="submit" id="btn-login"
        class="w-full py-2.5 bg-sky-600 hover:bg-sky-500 text-white font-semibold rounded-lg text-sm transition shadow-lg shadow-sky-600/20 flex items-center justify-center gap-2">
        <span>Đăng Nhập Vào Hệ Thống</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <!-- Quick test buttons -->
    <div class="mt-6 pt-5 border-t border-slate-700">
      <div class="text-[11px] font-semibold text-slate-400 mb-2 text-center uppercase tracking-wider">Tài khoản demo sẵn có:</div>
      <div class="grid grid-cols-3 gap-2">
        <button onclick="fillDemo('admin', 'admin123')" class="px-2 py-1.5 bg-slate-700/50 hover:bg-slate-700 text-slate-300 rounded text-xs text-center border border-slate-600 transition">
          <div class="font-bold text-sky-300">Admin</div>
          <div class="text-[10px] text-slate-400">admin / 123</div>
        </button>
        <button onclick="fillDemo('thukho', 'thukho123')" class="px-2 py-1.5 bg-slate-700/50 hover:bg-slate-700 text-slate-300 rounded text-xs text-center border border-slate-600 transition">
          <div class="font-bold text-emerald-300">Thủ kho</div>
          <div class="text-[10px] text-slate-400">thukho / 123</div>
        </button>
        <button onclick="fillDemo('ketoan', 'ketoan123')" class="px-2 py-1.5 bg-slate-700/50 hover:bg-slate-700 text-slate-300 rounded text-xs text-center border border-slate-600 transition">
          <div class="font-bold text-amber-300">Kế toán</div>
          <div class="text-[10px] text-slate-400">ketoan / 123</div>
        </button>
      </div>
    </div>

    <div class="mt-5 text-center text-xs text-slate-400">
      Chưa có tài khoản? <a href="/register" class="text-sky-400 hover:underline font-semibold">Đăng ký mới tại đây</a>
    </div>
  </div>

  <script>
    function fillDemo(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const errorBox = document.getElementById('error-box');
      const errorMsg = document.getElementById('error-message');
      const btn = document.getElementById('btn-login');

      errorBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xác thực...';

      try {
        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ TenDangNhap: u, MatKhau: p })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Đăng nhập thất bại.');
        }
        localStorage.setItem('access_token', data.access_token);
        localStorage.setItem('user_info', JSON.stringify(data.user));
        window.location.href = '/dashboard';
      } catch (err) {
        errorBox.classList.remove('hidden');
        errorMsg.innerText = err.message;
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<span>Đăng Nhập Vào Hệ Thống</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    }
  </script>
</body>
</html>\n
