<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts: Be Vietnam Pro & Plus Jakarta Sans (Tối ưu hóa hiển thị tiếng Việt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', '"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, ::before, ::after {
      font-family: 'Be Vietnam Pro', 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      font-family: 'Be Vietnam Pro', 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-white tracking-wide">Đăng Ký Tài Khoản</h1>
      <p class="text-xs text-sky-400 font-semibold mt-1">HỆ THỐNG QUẢN LÝ KHO SMARTLOGIS AI</p>
    </div>

    <div id="reg-error" class="hidden mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs"></div>
    <div id="reg-success" class="hidden mb-4 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 text-xs"></div>

    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Họ Và Tên</label>
        <input type="text" id="reg-hoten" required placeholder="Ví dụ: Hoàng Tiến Đạt"
          class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-sky-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Tên Đăng Nhập</label>
        <input type="text" id="reg-username" required placeholder="Tối thiểu 3 ký tự"
          class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-sky-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Mật Khẩu</label>
        <input type="password" id="reg-password" required placeholder="Tối thiểu 6 ký tự"
          class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-sky-500">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Vai Trò Người Dùng</label>
        <select id="reg-role" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-sky-500">
          <option value="Thukho" selected>Thủ kho (Vận hành nhập / xuất)</option>
          <option value="Ketoan">Kế toán (Đối soát & Báo cáo)</option>
          <option value="Admin">Admin (Quản trị hệ thống)</option>
        </select>
      </div>

      <button type="submit" id="btn-reg"
        class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg text-sm transition shadow-lg shadow-emerald-600/20">
        Tạo Tài Khoản
      </button>
    </form>

    <div class="mt-5 text-center text-xs text-slate-400">
      Đã có tài khoản? <a href="/login" class="text-sky-400 hover:underline font-semibold">Đăng nhập ngay</a>
    </div>
  </div>

  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const hoten = document.getElementById('reg-hoten').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const role = document.getElementById('reg-role').value;

      const errBox = document.getElementById('reg-error');
      const succBox = document.getElementById('reg-success');
      errBox.classList.add('hidden');
      succBox.classList.add('hidden');

      try {
        const res = await fetch('/api/v1/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ TenDangNhap: username, MatKhau: password, HoTen: hoten, VaiTro: role })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Đăng ký thất bại.');

        succBox.innerText = 'Đăng ký tài khoản thành công! Đang chuyển hướng sang trang đăng nhập...';
        succBox.classList.remove('hidden');
        setTimeout(() => window.location.href = '/login', 1500);
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      }
    }
  </script>
</body>
</html>\n
