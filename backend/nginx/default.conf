# =============================================================================
# NGINX REVERSE PROXY & MULTI-DEVICE GATEWAY CONFIGURATION FOR SMARTLOGIS AI
# =============================================================================

# 1. Định nghĩa Connection Upgrade mapping cho WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. Định nghĩa Upstream Services: Frontend (Port 3000) và Backend (Port 8000)
upstream frontend_service {
    # Dịch vụ Frontend Web UI (Port 3000)
    server frontend:3000 max_fails=3 fail_timeout=10s;
    # Cơ chế High Availability Fallback: tự động chuyển tiếp về backend nếu frontend chưa sẵn sàng
    server backend:8000 backup;
}

upstream backend_service {
    # Dịch vụ Backend FastAPI & Realtime WebSocket (Port 8000)
    server backend:8000;
}

# =============================================================================
# 3. SERVER BLOCK: HTTP (PORT 80) - CỔNG VÀO CHÍNH CHO ĐA THIẾT BỊ
# Cho phép truy cập từ: Localhost, IP LAN (192.168.x.x, 10.x.x.x), và Domain
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25M;

    # Tối ưu nén Gzip tài nguyên tĩnh
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Chứng thực SSL tự động với Let's Encrypt (Certbot ACME Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # A. ROUTE API BACKEND: /api/ -> Chuyển tiếp sang Backend Container (Port 8000)
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Tài liệu API Swagger & OpenAPI Schema
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # B. ROUTE WEBSOCKET: /ws/ & /ws -> Realtime WebSocket Upgrade
    # -------------------------------------------------------------------------
    location /ws/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers bắt buộc cho đồng bộ thời gian thực giữa các thiết bị
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout dài (24 giờ) tránh ngắt kết nối WebSocket stream
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ws {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # C. ROUTE FRONTEND: / -> Chuyển tiếp sang Frontend Container
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# 4. SERVER BLOCK: HTTPS (PORT 443) - SSL/TLS CHO DOMAIN SMARTLOGIS-AI.COM
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartlogis-ai.com www.smartlogis-ai.com localhost;

    # Đường dẫn chứng chỉ SSL Let's Encrypt / Local Root CA
    ssl_certificate /etc/letsencrypt/live/smartlogis-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartlogis-ai.com/privkey.pem;

    # Cấu hình bảo mật SSL/TLS tối ưu
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers bảo vệ ứng dụng Web
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    client_max_body_size 25M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Route API
    location /api/ {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route WebSocket Realtime
    location /ws/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /ws {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Route Frontend
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
